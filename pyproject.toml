[project]
name = "thefuck-py3-12-x"
version = "4.1"
description = "Corrects your previous console command, patched for modern Python."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "colorama>=0.4.6",
    "decorator>=5.2.1",
    "fastentrypoints>=0.12",
    "flake8>=7.3.0",
    "mock>=5.2.0",
    "pexpect>=4.9.0",
    "psutil>=7.2.2",
    "pypandoc>=1.16.2",
    "pyte>=0.8.2",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "pytest-docker-pexpect>=0.9",
    "pytest-mock>=3.15.1",
    "setuptools>=17.1",
    "twine>=6.2.0",
    "wheel>=0.46.3",
]
